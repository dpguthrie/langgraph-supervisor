name: Braintrust eval gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: braintrust-evals-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  eval:
    name: Combined Score regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: 1
        run: |
          uv sync

      - name: Run evals and publish report
        uses: braintrustdata/eval-action@v2
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_PROJECT_NAME: ${{ secrets.BRAINTRUST_PROJECT_NAME }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRAINTRUST_CI_GATE_SCORE: Combined Score
          BRAINTRUST_CI_MAX_REGRESSIONS: "0"
          BRAINTRUST_CI_MAX_SCORE_DROP: "0"
        with:
          api_key: ${{ secrets.BRAINTRUST_API_KEY }}
          runtime: python
          package_manager: uv
          root: evals
          paths: >-
            eval_supervisor.py
            eval_ci_reporter.py

      - name: Enforce score gate
        if: always()
        shell: bash
        run: |
          if [[ "${BRAINTRUST_CI_GATE_PASSED:-}" != "true" ]]; then
            echo "::error::Braintrust score gate failed. See the PR report and eval logs."
            exit 1
          fi
